<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    const desktopPreview = new URLSearchParams(location.search).has('atlas') && matchMedia('(min-width: 900px)');
    function fitAppFrame() {
      const field = document.documentElement.classList.contains('field-mode');
      document.documentElement.classList.toggle('phone-layout', field || !desktopPreview || !desktopPreview.matches);
    }
    fitAppFrame();
    if (desktopPreview) desktopPreview.addEventListener('change', fitAppFrame);
    window.addEventListener('farm-field-change', fitAppFrame);
  </script>
  <meta name="theme-color" content="#1E5B3D">
  <title>농사처방 · 담양 농장 홈</title>
